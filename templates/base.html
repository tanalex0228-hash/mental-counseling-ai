{% load static %}
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 心理諮商</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body
  class="theme-{{ profile.preferred_theme_color|default:'teal' }} {% if profile.dark_mode %}theme-dark{% endif %} font-{{ profile.font_scale|default:'normal' }} density-{{ profile.chat_density|default:'cozy' }} effect-{{ profile.visual_effect|default:'none' }} bubble-{{ profile.bubble_style|default:'standard' }}"
  {% if profile.custom_accent_color %}style="--accent: {{ profile.custom_accent_color }}; --accent-strong: color-mix(in srgb, {{ profile.custom_accent_color }}, black 28%); --user: color-mix(in srgb, {{ profile.custom_accent_color }}, white 84%);"{% endif %}
>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
